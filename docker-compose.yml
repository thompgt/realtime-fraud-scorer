# Local development stack for realtime-fraud-scorer.
#
# Infrastructure only at this stage: ZooKeeper, Kafka (ZooKeeper mode),
# Postgres, Flink, Airflow. The application services (generator, Flink job
# submitter, query API) are added in their respective phases -- see PLAN.md.
#
#   docker compose up -d          # boot the stack
#   docker compose ps             # all services should report healthy
#   docker compose down -v        # tear down, including volumes

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.2-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Static keys are fine for a local dev stack; never reuse them elsewhere.
    AIRFLOW__CORE__FERNET_KEY: "TXlLZXlUaGF0SXNFeGFjdGx5MzJCeXRlc0xvbmchIQ=="
    AIRFLOW__WEBSERVER__SECRET_KEY: "local-dev-secret"
    FRAUD_ZOOKEEPER_HOSTS: "zookeeper:2181"
    FRAUD_KAFKA_BOOTSTRAP: "kafka:29092"
    FRAUD_FLINK_REST: "http://jobmanager:8081"
    FRAUD_DB_URL: "postgresql+psycopg2://fraud:fraud@postgres:5432/fraud"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: fraud-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      # `ruok`/`srvr` are needed by the healthcheck below; `mntr` is handy
      # when poking at the ensemble by hand.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,mntr,stat"
    ports:
      - "${FRAUD_ZK_PORT:-2181}:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: fraud-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: containers talk to kafka:29092, the host talks to
      # localhost:9092. Getting this wrong is the classic "connects then
      # times out" Kafka-in-Docker failure.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${FRAUD_KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      # Published ports are overridable via .env because this stack often runs
      # alongside other local projects. Containers always use the in-network
      # default (5432 here) regardless of what the host side is mapped to.
      - "${FRAUD_PG_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: fraud-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${FRAUD_FLINK_UI_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        state.backend: hashmap
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints
      - ./fraud-flink-job/target:/opt/fraud/jars:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy
    deploy:
      replicas: 2
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: hashmap
    volumes:
      - flink-checkpoints:/tmp/flink-checkpoints

  airflow-init:
    <<: *airflow-common
    container_name: fraud-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username airflow --password airflow
        --firstname Local --lastname Dev --role Admin --email dev@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  airflow-webserver:
    <<: *airflow-common
    container_name: fraud-airflow-webserver
    command: webserver
    ports:
      - "${FRAUD_AIRFLOW_PORT:-8088}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  flink-checkpoints:
  airflow-logs:
